name: Terraform Destroy (manual)

# Se ejecuta SOLO a mano desde la pestaña Actions. Destruye toda la infraestructura
# de la tienda para dejar de consumir créditos. Requiere aprobación del entorno.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: "Escribe DESTRUIR para confirmar"
        required: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    name: Destruir infraestructura
    if: inputs.confirmar == 'DESTRUIR'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13.0"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init con estado remoto
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Destroy
        working-directory: infra
        run: terraform destroy -auto-approve -input=false
