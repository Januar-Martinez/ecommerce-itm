name: Terraform CI/CD

# Pull request  -> valida, escanea seguridad y muestra el plan (NO crea nada)
# Merge a main  -> valida y, tras APROBACIÓN MANUAL (entorno "production"), aplica

on:
  pull_request:
    paths:
      - "infra/**"
      - "app/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "app/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}

jobs:
  # ---------------------------------------------------------------------------
  # 1) Calidad: formato, validación y seguridad. No necesita credenciales de AWS.
  # ---------------------------------------------------------------------------
  validate:
    name: Validar y escanear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13.0"

      - name: Formato (terraform fmt)
        run: terraform fmt -check -recursive -diff

      - name: Init sin backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validar (terraform validate)
        working-directory: infra
        run: terraform validate

      - name: Escaneo de seguridad (Checkov)
        run: |
          pip install --quiet checkov
          checkov --directory infra --framework terraform --config-file .checkov.yaml

  # ---------------------------------------------------------------------------
  # 2) Solo en pull requests: plan con rol de SOLO LECTURA
  # ---------------------------------------------------------------------------
  plan:
    name: Plan (pull request)
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13.0"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init con estado remoto
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        id: plan
        working-directory: infra
        continue-on-error: true
        run: terraform plan -no-color -input=false -lock=false

      - name: Comentar el plan en el pull request
        uses: actions/github-script@v8
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
          OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const plan = (process.env.PLAN || '(sin salida)').slice(0, 60000);
            const body = [
              `### Terraform plan: ${process.env.OUTCOME}`,
              '<details><summary>Ver el plan completo</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
              '',
              '*El plan no crea nada. La infraestructura se crea al hacer merge a `main` y aprobar el despliegue.*'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fallar si el plan falló
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ---------------------------------------------------------------------------
  # 3) Solo en main: apply, con aprobación manual del entorno "production"
  # ---------------------------------------------------------------------------
  apply:
    name: Apply (main, requiere aprobación)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.13.0"

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Init con estado remoto
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        working-directory: infra
        run: terraform apply -input=false tfplan

      - name: Resultados (URL de la tienda y endpoints)
        working-directory: infra
        run: terraform output
